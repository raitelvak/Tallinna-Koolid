name: Update all Tallinn schools

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  update-schools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Update school data
        run: npm run update:schools

      - name: Display update diagnostics
        if: always()
        run: |
          if [ -f src/data/schools-debug.json ]; then
            cat src/data/schools-debug.json
          fi

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schools-scrape-error
          path: schools-scrape-error.png
          if-no-files-found: ignore

      - name: Commit updated school data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/schools.json
          git add src/data/schools-debug.json

          if git diff --cached --quiet; then
            echo "Koolide andmed ei muutunud."
          else
            git commit -m "Update Tallinn school data"
            git push
          fi
